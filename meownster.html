<!DOCTYPE html>
<html lang="en">
<head>
    <title>MEOWNSTER</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <div id="main">
        <header style="font-family: header;">
            <center><h2>CATHERINE</h2></center>
        </header>
        <div>
            <canvas class="canvases" id="body" width="800px" height="800px" style="z-index: 0;"></canvas>
            <canvas class="canvases" id="Tops" width="800px" height="800px" style="z-index: 3;"></canvas>
            <canvas class="canvases" id="Makeup" width="800px" height="800px" style="z-index: 1;"></canvas>
            <canvas class="canvases" id="Bottoms" width="800px" height="800px" style="z-index: 2;"></canvas>
            <canvas class="canvases" id="Accessories" width="800px" height="800px" style="z-index: 4;"></canvas>
        </div>
        <center>
            <button onclick="DrawTop()" >Tops</button>
            <button onclick="DrawMake()" >Looks</button>
            <button onclick="DrawBottom()">Bottoms</button>
            <button onclick="DrawAcc()">Accessories</button>
        </center>
        <img src="https://64.media.tumblr.com/34a9e597dd12f3e73bc5ee967693a2a3/579e5316ffbe1944-c0/s1280x1920/24d09342f58c5f63ffb7006e9949a8465cc542ba.pnj" width="100%">
    </div>
</body>
<style>
    @font-face {
        font-family: header;
        src: url('https://cdn.hackclub.com/01a19240-bf0f-730e-bbbc-d4a2d5b18131/Code462WPink-Regular.ttf');
    }

    body {
        background-image: url('https://cdn.hackclub.com/01a19215-4731-7ed4-8ae3-ff26063b2284/background.png');
    }
    #main {
    position: relative;
    margin: auto;
    width: 800px;
    border: 3px solid #000;
    height:120vh;
    padding: 10px;
    align-items: center;  
    justify-content: center;
    margin-inline: auto; 
    background-color: #FFF;
    }
    .canvases {
        margin:auto;
        border:1px solid #000;
        position: absolute;
        left: 10px;
        top: 200px;
    }
    button{
        padding:5px 5px 5px 30px; 
        background:url('https://64.media.tumblr.com/4a8c90d47a0c8b2c271e893f245aabb3/30f7ff9b6708cdf7-08/s75x75_c1/231a594ba4685cb25d3cf24caa442dfb2be26d1c.gifv') no-repeat 5px center;
    }
</style>


<script type="text/javascript">
    
const canvas = document.getElementById('body');
const Topcan = document.getElementById('Tops');
const MakeupCan = document.getElementById('Makeup')
const BotCan = document.getElementById('Bottoms')
const AccCan = document.getElementById('Accessories')


const canvasSize = 800

const TopCtx = Topcan.getContext('2d');
const ctx = canvas.getContext('2d');
const MakeupCtx = MakeupCan.getContext('2d');
const BottomCtx = BotCan.getContext('2d');
const AccCtx = AccCan.getContext('2d');

let Topindex = 0;
let MakeupIndex = 0;
let BottomIndex = 0;
let AccIndex = 0

const img = new Image();
img.src = 'sprites/Monster.png';


let Topimg = new Image();
let makeupImg = new Image();
let BottomImg = new Image();
let AccImg = new Image();


function DrawMake() {
    if (MakeupIndex == 1) {
        makeupImg.src = "https://cdn.hackclub.com/01a19215-d91f-7a97-b9fe-2b370072dc7c/makeup1.png";
        MakeupIndex++;
    } else if (MakeupIndex == 2) {
        makeupImg.src = "https://cdn.hackclub.com/01a19215-d9cb-7d7a-8f0e-13f29d23c49f/makeup2.png";
        MakeupIndex++;
    } else if (MakeupIndex == 3) {
        makeupImg.src = "https://cdn.hackclub.com/01a19215-da83-7337-82c5-d001a1741069/makeup3.png";
        MakeupIndex++;
    } else {
        makeupImg.src = "";
        MakeupIndex = 0;
        MakeupIndex++;
    }
    MakeupCtx.clearRect(0, 0, canvasSize, canvasSize);
    MakeupCtx.drawImage(makeupImg,0,0, canvasSize,canvasSize);
}

function DrawTop() {
    if (Topindex == 1) {
        Topimg.src = "https://cdn.hackclub.com/01a19215-f074-78b7-ab91-ba48dda32bf9/top1.png";
        Topindex++;
    } else if (Topindex == 2) {
        Topimg.src = "https://cdn.hackclub.com/01a19216-ee13-7b57-9b35-6b184cc3c86f/top2.png";
        Topindex++;
    } else if (Topindex == 3) {
        Topimg.src = "https://cdn.hackclub.com/01a19216-04f5-75fa-ada7-203fba72d7ee/top3.png";
        Topindex++;
    }else if (Topindex == 4) {
        Topimg.src = "https://cdn.hackclub.com/01a19215-d63e-7149-bbc3-71d7b4a9db92/Bikini.png";
        Topindex++;
    } else {
        Topimg.src = "";
        Topindex = 0;
        Topindex++;
    }
    TopCtx.clearRect(0, 0, canvasSize, canvasSize);
    TopCtx.drawImage(Topimg,0,0, canvasSize,canvasSize);
}

function DrawBottom() {
    if (BottomIndex == 1) {
        BottomImg.src = "https://cdn.hackclub.com/01a19215-d6eb-73d7-a74d-9d635a55b75a/bottom1.png";
        BottomIndex++;
    } else if (BottomIndex == 2) {
        BottomImg.src = "https://cdn.hackclub.com/01a19215-d817-70fd-858b-740fed98d326/bottom2.png";
        BottomIndex++;
    } else {
        BottomImg.src = "";
        BottomIndex = 0;
        BottomIndex++;
    }
    BottomCtx.clearRect(0, 0, canvasSize, canvasSize);
    BottomCtx.drawImage(BottomImg,0,0, canvasSize,canvasSize);
}
function DrawAcc(){
    if (AccIndex == 1){
        AccImg.src = "https://cdn.hackclub.com/01a19225-0cde-7da7-83e9-91998c8d5ba3/Bow1.png"
        AccIndex++;
    } else if (AccIndex == 2) {
        AccImg.src = "https://cdn.hackclub.com/01a19226-8585-7f8f-956b-291de9d50833/Bow2.png";
        AccIndex++;
    } else {
        AccImg.src = "";
        AccIndex = 0;
        AccIndex++;
    }
    AccCtx.clearRect(0, 0, canvasSize, canvasSize);
    AccCtx.drawImage(AccImg,0,0,canvasSize,canvasSize)
}
img.onload = function() {
    ctx.drawImage(img,0,0, canvasSize, canvasSize);
}

</script>
</html>
