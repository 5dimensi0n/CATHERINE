<!DOCTYPE html>
<html lang="en">
<head>
    <title>MEOWNSTER</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <header>
        <h2>MEOWNSTER</h2>
    </header>
    <canvas id="body" width="1000px" height="1000px" style="border:1px solid #000;position: absolute; left: 0; top: 200px; z-index: 0;"></canvas>
    <canvas id="Tops" width="1000px" height="1000px" style="border:1px solid #000;position: absolute; left: 0; top: 200px; z-index: 1;"></canvas>
    <button onclick="DrawTop()" style="z-index: 2;">->></button>
    <p id="demo"></p>
</body>



<script type="text/javascript">
    
const canvas = document.getElementById('body');
const Topcan = document.getElementById('Tops');

const TopCtx = Topcan.getContext('2d');
const ctx = canvas.getContext('2d');

let Topindex = 1;

const img = new Image();
img.src = 'sprites/Monster.png';


let Topimg = new Image();

function DrawTop() {
    if (Topindex == 0) {
        Topimg.src = "sprites/Bikini.png";
    } else if (Topindex == 1) {
        Topimg.src = "sprites/Shirt.png";
    } else if (Topindex == 2) {
        Topimg.src = "sprites/Bikini.png";
    } else {
        Topimg.src = "sprites/Shirt.png";
        Topindex = 0;
    }
    Topindex++;
    document.getElementById("demo").innerHTML = Topindex;
    TopCtx.clearRect(0, 0, canvas.width, canvas.height);
    TopCtx.drawImage(Topimg,0,0, 1000,1000);
}
img.onload = function() {
    ctx.drawImage(img,0,0, 1000, 1000);
    TopCtx.drawImage(Topimg,0,0, 1000,1000);
}

</script>
</html>
